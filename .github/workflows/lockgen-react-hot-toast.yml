name: Temporary react-hot-toast lock generation

on:
  push:
    branches:
      - chore/react-hot-toast-lockgen-2026-08-08

permissions:
  contents: write

jobs:
  lockgen:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/react-hot-toast-lockgen-2026-08-08
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Add react-hot-toast
        run: pnpm add react-hot-toast@2.6.0 --save-exact
      - name: Commit package metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          git diff --cached --quiet || git commit -m "chore: add react-hot-toast"
          git push origin HEAD:chore/react-hot-toast-lockgen-2026-08-08
