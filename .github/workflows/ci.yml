name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  NODE_VERSION: '22'
  NEXT_PUBLIC_APP_NAME: GovFleet Namibia

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Report legacy repository formatting debt
        continue-on-error: true
        run: pnpm format:check
      - name: Report legacy repository lint debt
        continue-on-error: true
        run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [quality]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: govfleet
          POSTGRES_PASSWORD: govfleet-test
          POSTGRES_DB: govfleet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      localstack:
        image: localstack/localstack:3.8
        env:
          SERVICES: s3
          AWS_DEFAULT_REGION: us-east-1
          EAGER_SERVICE_LOADING: '1'
        ports:
          - 4566:4566
        options: >-
          --health-cmd "curl -fsS http://localhost:4566/_localstack/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://govfleet:govfleet-test@localhost:5432/govfleet_test
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: test-secret-thirty-two-characters-long!!
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      SEED_ADMIN_EMAIL: admin@kavangoeast.gov.na
      SEED_ADMIN_PASSWORD: changeme
      R2_ACCOUNT_ID: ci-localstack
      R2_ACCESS_KEY_ID: test
      R2_SECRET_ACCESS_KEY: test
      R2_BUCKET_NAME: grn-fleet
      R2_ENDPOINT: http://localhost:4566
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      - name: Create disposable S3 test bucket
        run: >-
          node --input-type=module -e "import { CreateBucketCommand, S3Client } from '@aws-sdk/client-s3';
          const client = new S3Client({ region: 'us-east-1', endpoint: process.env.R2_ENDPOINT,
          forcePathStyle: true, credentials: { accessKeyId: process.env.R2_ACCESS_KEY_ID,
          secretAccessKey: process.env.R2_SECRET_ACCESS_KEY } });
          await client.send(new CreateBucketCommand({ Bucket: process.env.R2_BUCKET_NAME }));"

      - name: Run migrations
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Seed database
        run: pnpm db:seed
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Seed admin user
        run: npx tsx src/seed/seed-users.ts
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          SEED_ADMIN_EMAIL: ${{ env.SEED_ADMIN_EMAIL }}
          SEED_ADMIN_PASSWORD: ${{ env.SEED_ADMIN_PASSWORD }}

      - name: Start dev server
        run: |
          pnpm dev &>/tmp/dev-server.log &
          for i in $(seq 1 60); do
            curl -s -o /dev/null http://localhost:3000 && break
            sleep 1
          done
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          BETTER_AUTH_URL: ${{ env.BETTER_AUTH_URL }}
          BETTER_AUTH_SECRET: ${{ env.BETTER_AUTH_SECRET }}
          NEXT_PUBLIC_APP_URL: ${{ env.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_APP_NAME: ${{ env.NEXT_PUBLIC_APP_NAME }}
          R2_ACCOUNT_ID: ${{ env.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ env.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ env.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ env.R2_BUCKET_NAME }}
          R2_ENDPOINT: ${{ env.R2_ENDPOINT }}

      - name: Perf regression guard (page render budgets)
        run: node scripts/bench-pages.mjs --budget
        env:
          NEXT_PUBLIC_APP_URL: ${{ env.NEXT_PUBLIC_APP_URL }}
          SEED_ADMIN_EMAIL: ${{ env.SEED_ADMIN_EMAIL }}
          SEED_ADMIN_PASSWORD: ${{ env.SEED_ADMIN_PASSWORD }}

      - name: Run integration tests
        run: pnpm test:integration
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          BETTER_AUTH_URL: ${{ env.BETTER_AUTH_URL }}
          BETTER_AUTH_SECRET: ${{ env.BETTER_AUTH_SECRET }}
          NEXT_PUBLIC_APP_URL: ${{ env.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_APP_NAME: ${{ env.NEXT_PUBLIC_APP_NAME }}
          SEED_ADMIN_EMAIL: ${{ env.SEED_ADMIN_EMAIL }}
          SEED_ADMIN_PASSWORD: ${{ env.SEED_ADMIN_PASSWORD }}

      - name: Install Chromium for production-closure browser checks
        run: pnpm exec playwright install --with-deps chromium

      - name: Run production-closure browser checks
        run: >-
          pnpm exec playwright test
          src/e2e/request-return-cancellation-closure.spec.ts
          src/e2e/cross-tenant-isolation.spec.ts
          src/e2e/all-role-ui-smoke.spec.ts
          src/e2e/document-native-print.spec.ts
          src/e2e/revised-authority-closure.spec.ts
          src/e2e/clean-trip-closure.spec.ts
          src/e2e/external-driver-lifecycle-closure.spec.ts
          src/e2e/driver-licence-upload-review.smoke.spec.ts
          --project=chromium --workers=1
        env:
          # Reuse the already-running integration server. An empty CI value
          # makes Playwright's configured reuseExistingServer guard true while
          # GitHub Actions itself remains a CI environment.
          CI: ''
          DATABASE_URL: ${{ env.DATABASE_URL }}
          BETTER_AUTH_URL: ${{ env.BETTER_AUTH_URL }}
          BETTER_AUTH_SECRET: ${{ env.BETTER_AUTH_SECRET }}
          NEXT_PUBLIC_APP_URL: ${{ env.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_APP_NAME: ${{ env.NEXT_PUBLIC_APP_NAME }}
          SEED_ADMIN_EMAIL: ${{ env.SEED_ADMIN_EMAIL }}
          SEED_ADMIN_PASSWORD: ${{ env.SEED_ADMIN_PASSWORD }}
          R2_ACCOUNT_ID: ${{ env.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ env.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ env.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ env.R2_BUCKET_NAME }}
          R2_ENDPOINT: ${{ env.R2_ENDPOINT }}

      - name: Upload production-closure Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-closure-playwright-report
          path: playwright-report/
          if-no-files-found: ignore

      - name: Stop dev server
        if: always()
        run: kill $(lsof -ti :3000) 2>/dev/null || true
